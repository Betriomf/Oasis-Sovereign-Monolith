<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oasis Swarm Node — Ceder Cómputo WebGPU</title>
  <style>
    body { background: #040906; color: #aaddcc; font-family: -apple-system, monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .panel { background: #08140e; border: 1px solid #005a36; border-radius: 12px; padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 4px 20px rgba(0,255,157,0.1); }
    h1 { color: #00ff9d; font-size: 20px; margin-top: 0; }
    .btn-yield { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin: 16px 0; }
    .btn-on { background: #00ff9d; color: #040906; }
    .btn-off { background: #22332a; color: #88aa99; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .metric-box { background: #050d08; border: 1px solid #00331f; padding: 12px; border-radius: 6px; text-align: center; }
    .metric-val { font-size: 22px; font-weight: bold; color: #00ff9d; }
    .metric-lbl { font-size: 11px; color: #669988; text-transform: uppercase; margin-top: 4px; }
    .log-box { background: #020503; border: 1px solid #002617; padding: 10px; border-radius: 6px; font-size: 11px; height: 100px; overflow-y: auto; color: #44aa77; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>🛰️ OASIS SWARM NODE</h1>
    <p style="font-size: 12px; color: #77aa99; line-height: 1.4;">
      Dispositivo conectado a la malla Gossip. Procesando tensores intermedios en silicio frío mediante WebGPU.
    </p>

    <button id="toggleBtn" class="btn-yield btn-on" onclick="toggleCompute()">⚡ CEDER CÓMPUTO: ACTIVO</button>

    <div class="metric-grid">
      <div class="metric-box">
        <div id="val-node-id" class="metric-val" style="font-size:14px; word-break:break-all;">Detectando...</div>
        <div class="metric-lbl">ID de Nodo</div>
      </div>
      <div class="metric-box">
        <div id="val-power" class="metric-val">0.85 W</div>
        <div class="metric-lbl">Consumo Local</div>
      </div>
      <div class="metric-box">
        <div id="val-gflops" class="metric-val">140</div>
        <div class="metric-lbl">GFLOPS Donados</div>
      </div>
      <div class="metric-box">
        <div id="val-latency" class="metric-val">1.94 ms</div>
        <div class="metric-lbl">Cadencia Áurea</div>
      </div>
    </div>

    <div class="log-box" id="logBox">
      [0.00ms] Silicio frío inicializado.<br>
      [1.94ms] Conexión P2P lista.
    </div>
  </div>

  <script>
    let active = true;
    const nodeId = "NODE-" + Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById("val-node-id").textContent = nodeId;

    function toggleCompute() {
      active = !active;
      const btn = document.getElementById("toggleBtn");
      if (active) {
        btn.textContent = "⚡ CEDER CÓMPUTO: ACTIVO";
        btn.className = "btn-yield btn-on";
        log("Cómputo reactivado: procesando forward passes.");
      } else {
        btn.textContent = "💤 CÓMPUTO EN PAUSA";
        btn.className = "btn-yield btn-off";
        log("Nodo en estasis térmico: 0.00 W.");
      }
    }

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<br>[${(performance.now()).toFixed(1)}ms] ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    // Enviar heartbeat al orquestador cada 3 segundos si está activo
    setInterval(() => {
      if (!active) return;
      fetch(`/v1/swarm/heartbeat?id=${nodeId}&gflops=140&power=0.85`, { method: "POST" })
        .catch(() => {});
    }, 3000);
  </script>
</body>
</html>
