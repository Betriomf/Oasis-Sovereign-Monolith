name: Oasis Sovereign Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bitmask-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Monolito
      uses: actions/checkout@v4

    - name: Configurar Entorno Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependencias de Test
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx

    - name: Ejecutar Auditoría BitMaskOS
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_bitmask_security.py -v --durations=5
