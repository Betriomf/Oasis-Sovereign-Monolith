name: Lean 4 Formal Verification Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-lean4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan & Lean 4.36.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Run Deterministic Lean 4 Audit
        run: ./verify_all_lean.sh
