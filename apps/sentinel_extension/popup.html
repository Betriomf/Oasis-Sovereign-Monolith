<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 14px;
      margin: 0;
    }
    h2 { font-size: 14px; margin: 0 0 8px 0; color: #58a6ff; }
    .status-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .metric { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .btn {
      width: 100%;
      background: #238636;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .footer { font-size: 10px; color: #8b949e; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>🛰️ Oasis Sentinel</h2>
  <div class="status-card">
    <div class="metric"><span>Modo:</span> <strong>Laminar (< 5.39W)</strong></div>
    <div class="metric"><span>Compresión:</span> <strong>Holográfica (phi)</strong></div>
    <div class="metric"><span>Telemetría:</span> <strong>Neutralizada</strong></div>
  </div>
  <button class="btn" id="btn-sweep">🌌 Disparar Gran Barrido</button>
  <div class="footer">Oasis Sovereign Monolith — Capa 0</div>

  <script>
    document.getElementById('btn-sweep').addEventListener('click', () => {
      fetch('http://127.0.0.1:8000/api/sweep', { method: 'POST' })
        .then(() => alert('Barrido solicitado al nodo local.'))
        .catch(() => alert('Nodo local en espera (ejecuta oasis-sentinel en terminal).'));
    });
  </script>
</body>
</html>
