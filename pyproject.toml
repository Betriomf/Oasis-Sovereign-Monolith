[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis-shield"
version = "2.1.0"
description = "Zero-PII physical entropy bot detection and game netcode client"
authors = [{ name = "Mariano Panzano Caballe" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.8"

[tool.setuptools]
py-modules = ["oasis_shield"]
