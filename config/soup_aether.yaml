base_model: "Qwen/Qwen2.5-1.5B-Instruct"
output_dir: "models/aether_soup_output"

training_params:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  epochs: 3
  max_seq_length: 2048
  streaming_layers: true

datasets:
  - path: "datasets/aether_soup_train.jsonl"
    type: "chatml"

soup:
  strategy: "greedy_soup"
  evaluation_split: 0.1
  weights_out: "models/aether_final_soup"
