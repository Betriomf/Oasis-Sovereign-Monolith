<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OASIS — Linux x86 Real en WebAssembly (0.00 W Servidor)</title>
  <style>
    body { background: #03060a; color: #00ff9d; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    #screen_container { flex: 1; background: #000; border: 1px solid #00ffaa; border-radius: 6px; padding: 10px; }
    #screen_container pre { font-size: 13px; color: #00ffaa; margin: 0; }
  </style>
  <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>
  <div style="margin-bottom:8px; display:flex; justify-content:space-between;">
    <strong>🐧 KERNEL LINUX x86 CLIENT-SIDE (v86 WebAssembly Engine)</strong>
    <span style="color:#00e5ff;">Consumo Servidor: 0.00 W</span>
  </div>
  <div id="screen_container">
    <div style="white-space: pre;"></div>
    <canvas style="display: none"></canvas>
  </div>
  <script>
    window.addEventListener("load", () => {
      new V86Starter({
        wasm_path: "https://copy.sh/v86/build/v86.wasm",
        memory_size: 64 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
        vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
        cdrom: { url: "https://copy.sh/v86/images/linux.iso" },
        autostart: true
      });
    });
  </script>
</body>
</html>
