[package]
name = "oasis-wasm-core"
version = "3.1.0"
edition = "2021"
authors = ["Mariano Panzano Caballe"]
description = "Capa 0 WASM engine: Confinamiento pi-KB, Freno Geometrico y Lincos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
