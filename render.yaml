services:
  - type: web
    name: oasis-sovereign-wind-node
    runtime: python
    buildCommand: "python3 -m py_compile agents_core/oasis_render_gateway.py agents_core/oasis_hybrid_router.py agents_core/riona_agent.py"
    startCommand: "python3 agents_core/oasis_render_gateway.py"
    envVars:
      - key: PORT
        value: 8080
      - key: NO_TLS
        value: 1
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /terminal
    autoDeploy: true
